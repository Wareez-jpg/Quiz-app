<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Quiz App</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <div id="sky">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
            </div>

            <div id="intro-screen">
                <h1>
                    <span>NOVA</span> QUIZ
                </h1>

                <p>Explore. Learn. Master</p>

                <div class="quiz-info">
                    <div>10 Questions</div>
                    <div>20 Seconds</div>
                    <div>Science</div>
                </div>

                <button id="start-btn">
                    Start Quiz
                </button>
            </div>

            <div id="quiz-container" style="display:none">
                <div class="quiz-header">
                    <p id="question-number">Question 1 of 20</p>
                    <p id="timer">20s</p>
                </div>

                <h2 id="question"></h2>
                <div id="answer-buttons">
                    <button class="answer-btn">Option A</button>
                    <button class="answer-btn">Option B</button>
                    <button class="answer-btn">Option C</button>
                    <button class="answer-btn">Option D</button>
                </div>
                <button id="next-btn">Next</button>
            </div>
            <div id="score-container" style="display:none">
                <h2>Quiz Complete!</h2>
                <p id="score-text">You scored 0 out of 0</p>
                <button id="restart-btn">Restart</button>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
