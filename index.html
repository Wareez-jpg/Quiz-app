<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">
        <title>Quiz App</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
            <div id="sky">
                <div class="cloud cloud1"></div>
                <div class="cloud cloud2"></div>
                <div class="cloud cloud3"></div>
            </div>

            <div id="intro-screen">
                <h1>
                    <span>NOVA</span> Quiz
                </h1>

                <p>Explore. Learn. Master</p>

                <h3>Subject</h3>
                <select id="subject">
                    <option value="17">Science</option>
                    <option value="18">Computer Science</option>
                    <option value="19">Mathematics</option>
                    <option value="22">Geography</option>
                    <option value="23">History</option>
                </select>

                <h3>Difficulty</h3>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>

                <h3>Questions</h3>
                <select id="amount">
                    <option value="10">10 Questions</option>
                    <option value="20">20 Questions</option>
                    <option value="50">50 Questions</option>
                </select>

                <div class="quiz-info">
                    <div>Science</div>
                </div>

                <button id="start-btn">
                    Start Quiz
                </button>
            </div>

            <div id="quiz-container" style="display:none">
                <div class="quiz-header">
                    <buttom id="home-btn">Home</buttom>
                    <p id="question-number">Question 1 of 20</p>
                    <p id="timer">20s</p>
                </div>

                <h2 id="question"></h2>

                <div id="answer-buttons">
                    <button class="answer-btn">Option A</button>
                    <button class="answer-btn">Option B</button>
                    <button class="answer-btn">Option C</button>
                    <button class="answer-btn">Option D</button>
                </div>
                <button id="next-btn">Next</button>
            </div>
            <div id="score-container" style="display:none">
                <h2>Quiz Complete!</h2>
                <p id="score-text">You scored 0 out of 0</p>
                <button id="restart-btn">Play Again</button>
                <button id="score-home-btn">Home</button>
            </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
