<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quiz App</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
    <body>
        <div class="page">
            <main>
                <div id="sky">
                    <div class="cloud cloud1"></div>
                    <div class="cloud cloud2"></div>
                    <div class="cloud cloud3"></div>
                </div>

                <div id="intro-screen">
                    <h1>
                        <span>NOVA</span> Quiz
                    </h1>

                    <p>Explore. Learn. Master</p>

                    <h3>Subject</h3>
                    <select id="subject">
                        <option value="" selected disabled>Select a Subject</option>
                        <option value="17">Science</option>
                        <option value="18">Computer Science</option>
                        <option value="19">Mathematics</option>
                        <option value="22">Geography</option>
                        <option value="23">History</option>
                    </select>

                    <h3>Difficulty</h3>
                    <select id="difficulty">
                        <option value="" selected disabled>Select Difficulty</option>
                        <option value="easy">Easy</option>
                        <option value="medium">Medium</option>
                        <option value="hard">Hard</option>
                    </select>

                    <h3>Questions</h3>
                    <select id="amount">
                        <option value="" selected disabled>Select Number of Question</option>
                        <option value="10">10 Questions</option>
                        <option value="20">20 Questions</option>
                        <option value="50">50 Questions</option>
                    </select>

                    <button id="start-btn">
                        Start Quiz
                    </button>
                </div>

                <div id="quiz-container" style="display:none">
                    <h3 id="quiz-subject"></h3>

                    <div class="quiz-top">
                        <button id="home-btn">Home</button>
                        <p id="timer">20s</p>
                    </div>  

                    <p id="question-number">Question 1 of 20</p>                    

                    <h2 id="question"></h2>

                    <div id="answer-buttons">
                        <button class="answer-btn">Option A</button>
                        <button class="answer-btn">Option B</button>
                        <button class="answer-btn">Option C</button>
                        <button class="answer-btn">Option D</button>
                    </div>
                    <button id="next-btn">Next</button>
                </div>

                <div id="score-container" style="display:none">
                    <div id="score-emoji">🏆</div>
                    <h1>Quiz Complete!</h1>
                    <h2 id="score-subject"></h2>
                    <p id="score-difficulty"></p>
                    <div id="final-score"></div>
                    <p id="score-message"></p>

                    <div class="score-buttons">
                        <button id="restart-btn">Go Again</button>
                        <button id="score-home-btn">Home</button>
                    </div>
                </div>
            </main>
        </div>
        <script src="script.js"></script>

        
        <footer>
            <div class="footer-left">
                <p>Built by Wareez-jpg</p>
                <p>Have feedback? I'd love to hear it.</p>
            </div>

            <div class="footer-right">
                <a href="https://github.com/wareez-jpg" target="_blank">
                   <i class="fa-brands fa-github"></i>
                </a>
                <a href="mailto:wareezbamigboye777@gmail.com">
                    <i class="fa-solid fa-envelope"></i>
                </a>
            </div>
        </footer>
    </body>
</html>
